<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8ebf0" />
    <title>Lumina Calculator - Premium Edition</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" type="image/png" href="cal.png" />
  </head>

  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="calc-header">
        <div class="brand">
          <h1 class="brand-name">Lumina <span class="brand-accent">Calculator</span></h1>
          <p class="brand-tagline">Premium Edition</p>
        </div>

        <button
          class="theme-toggle"
          id="themeToggle"
          type="button"
          aria-label="Switch theme"
          aria-live="polite"
          title="Cycle through themes"
        >
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.1"></circle>
            <line x1="12" y1="2.6" x2="12" y2="5.2"></line>
            <line x1="12" y1="18.8" x2="12" y2="21.4"></line>
            <line x1="2.6" y1="12" x2="5.2" y2="12"></line>
            <line x1="18.8" y1="12" x2="21.4" y2="12"></line>
            <line x1="5.4" y1="5.4" x2="7.2" y2="7.2"></line>
            <line x1="16.8" y1="16.8" x2="18.6" y2="18.6"></line>
            <line x1="5.4" y1="18.6" x2="7.2" y2="16.8"></line>
            <line x1="16.8" y1="7.2" x2="18.6" y2="5.4"></line>
          </svg>

          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.8 8.8 0 1 0 11.1 11.1z"
            ></path>
          </svg>

          <svg class="icon icon-sparkle" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2L14 10L22 12L14 14L12 22L10 14L2 12L10 10L12 2Z"></path>
            <path d="M19 4L19.5 6L21.5 6.5L19.5 7L19 9L18.5 7L16.5 6.5L18.5 6L19 4Z"></path>
          </svg>
        </button>
      </header>

      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="display-history" id="displayHistory"></div>
        <div class="display-current" id="displayCurrent">0</div>
      </div>

      <div class="keys" id="keys">
        <button
          class="key key--func"
          type="button"
          data-action="clear"
          aria-label="All clear"
        >
          AC
        </button>
        <button
          class="key key--func"
          type="button"
          data-action="delete"
          aria-label="Delete last digit"
        >
          <svg
            class="key-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
            <line x1="18" y1="9" x2="12" y2="15" />
            <line x1="12" y1="9" x2="18" y2="15" />
          </svg>
        </button>
        <button
          class="key key--op"
          type="button"
          data-action="percent"
          aria-label="Percent"
        >
          %
        </button>
        <button
          class="key key--op"
          type="button"
          data-action="operator"
          data-value="÷"
          aria-label="Divide"
        >
          ÷
        </button>

        <button class="key" type="button" data-action="digit" data-value="7">
          7
        </button>
        <button class="key" type="button" data-action="digit" data-value="8">
          8
        </button>
        <button class="key" type="button" data-action="digit" data-value="9">
          9
        </button>
        <button
          class="key key--op"
          type="button"
          data-action="operator"
          data-value="×"
          aria-label="Multiply"
        >
          ×
        </button>

        <button class="key" type="button" data-action="digit" data-value="4">
          4
        </button>
        <button class="key" type="button" data-action="digit" data-value="5">
          5
        </button>
        <button class="key" type="button" data-action="digit" data-value="6">
          6
        </button>
        <button
          class="key key--op"
          type="button"
          data-action="operator"
          data-value="−"
          aria-label="Subtract"
        >
          −
        </button>

        <button class="key" type="button" data-action="digit" data-value="1">
          1
        </button>
        <button class="key" type="button" data-action="digit" data-value="2">
          2
        </button>
        <button class="key" type="button" data-action="digit" data-value="3">
          3
        </button>
        <button
          class="key key--op"
          type="button"
          data-action="operator"
          data-value="+"
          aria-label="Add"
        >
          +
        </button>

        <button
          class="key"
          type="button"
          data-action="sign"
          aria-label="Toggle sign"
        >
          ±
        </button>
        <button class="key" type="button" data-action="digit" data-value="0">
          0
        </button>
        <button
          class="key"
          type="button"
          data-action="decimal"
          aria-label="Decimal point"
        >
          .
        </button>
        <button
          class="key key--eq"
          type="button"
          data-action="equals"
          aria-label="Equals"
        >
          =
        </button>
      </div>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
